name: Build VoltPulse APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --console=plain 2>&1 | tee build.log || {
            echo "::error::编译遇到问题，摘要如下："
            grep -E "(e: |error: )" build.log || tail -n 35 build.log
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoltPulse-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
